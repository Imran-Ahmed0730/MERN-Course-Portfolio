    <rect x="540" y="60" width="130" height="26" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
    <circle cx="556" cy="72" r="4.5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="m559 75 3 3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="568" y="75" font-family="Inter, Arial, sans-serif" font-size="8" fill="#94a3b8">Search products</text>

