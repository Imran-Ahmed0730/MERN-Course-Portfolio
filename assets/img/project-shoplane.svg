    <circle cx="668" cy="188" r="112" fill="#ffffff" opacity="0.08"/>
    <circle cx="668" cy="188" r="78" fill="#ffffff" opacity="0.1"/>
    <circle cx="668" cy="188" r="46" fill="#ffffff" opacity="0.12"/>

    <rect x="68" y="142" width="86" height="16" rx="8" fill="#ffffff" opacity="0.16"/>
    <text x="111" y="153" font-family="Inter, Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="1" fill="#e0f2fe" text-anchor="middle">SUMMER 2026</text>
    <text x="68" y="190" font-family="Outfit, Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff">New season</text>
    <text x="68" y="218" font-family="Outfit, Arial, sans-serif" font-size="27" font-weight="800" fill="#e0f2fe">essentials.</text>
    <text x="68" y="238" font-family="Inter, Arial, sans-serif" font-size="8.5" fill="#c7d2fe">Fresh fits and everyday gear — up to 30% off.</text>
