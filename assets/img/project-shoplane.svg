      <path d="M52 62c18 6 44 8 68 8" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M60 46l10 10M74 38l10 12M88 34l10 14" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M12 82h136" stroke="#e0e7ff" stroke-width="7" stroke-linecap="round"/>
