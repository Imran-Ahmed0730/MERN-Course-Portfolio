    <path d="M698 70h12l-1.2 9h-9.6Z" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M701 70v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#475569" stroke-width="1.6"/>
    <circle cx="728" cy="63" r="7" fill="#6366f1"/>
