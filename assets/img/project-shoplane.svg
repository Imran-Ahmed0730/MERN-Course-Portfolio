        <path d="M552 455v8M548 459h8" stroke="#a21caf" stroke-width="1.6" stroke-linecap="round"/>
      </g>

      <!-- card 4 -->
      <g>
        <rect x="592" y="308" width="168" height="166" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#sl-shadow)"/>
        <rect x="592" y="308" width="168" height="102" rx="12" fill="url(#sl-img4)"/>
        <rect x="592" y="398" width="168" height="12" fill="url(#sl-img4)"/>
        <g transform="translate(652 326)">
          <rect x="8" y="18" width="36" height="44" rx="10" fill="#0f766e"/>
          <rect x="12" y="24" width="28" height="14" rx="5" fill="#5eead4"/>
          <path d="M18 18v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#115e59" stroke-width="4" stroke-linecap="round"/>
          <rect x="18" y="44" width="16" height="6" rx="3" fill="#99f6e4"/>
        </g>
        <text x="608" y="432" font-size="9" font-weight="600" fill="#0f172a">Everyday Pack</text>
        <text x="608" y="446" font-family="Inter, Arial, sans-serif" font-size="7.5" fill="#94a3b8">Bags · Water resistant</text>
        <text x="608" y="463" font-size="10" font-weight="700" fill="#0f766e">$59.00</text>
        <circle cx="736" cy="459" r="10" fill="#f0fdfa"/>
        <path d="M736 455v8M732 459h8" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round"/>
