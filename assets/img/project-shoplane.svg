    <rect width="800" height="44" fill="#0f172a"/>
    <circle cx="24" cy="22" r="5" fill="#f87171" opacity="0.85"/>
    <circle cx="42" cy="22" r="5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="60" cy="22" r="5" fill="#34d399" opacity="0.85"/>
    <rect x="300" y="13" width="200" height="18" rx="9" fill="#1e293b"/>
    <text x="400" y="26" font-family="Inter, Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">shoplane.store</text>

    <!-- navbar -->
    <rect x="0" y="44" width="800" height="58" fill="#ffffff"/>
    <path d="M0 102h800" stroke="#e2e8f0"/>

    <rect x="40" y="62" width="24" height="24" rx="7" fill="url(#sl-btn)"/>
    <path d="M47 74h10l-1.5 6h-7Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M49 74v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#fff" stroke-width="1.6"/>
    <text x="72" y="80" font-family="Outfit, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">ShopLane</text>

    <g font-family="Inter, Arial, sans-serif" font-size="9" fill="#64748b">
      <text x="220" y="78" font-weight="600" fill="#0f172a">New in</text>
